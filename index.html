<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <main class="gate">
    <h1 id="title" class="gate__title">halt! ✋ kiss tax</h1>
    <p id="sub" class="gate__sub">5 kisses to enter, bonny. no exceptions.</p>

    <div class="stage">
      <div id="bubble" class="bubble">pay the kiss tax, bonny 💋</div>

      <div id="face-wrap" class="face-wrap">

      </div>
    </div>

    <div id="tally" class="tally" aria-label="kisses paid"></div>
    <p class="hint">click my face to kiss 💋</p>
    <a id="enter" class="btn enter" href="hub.html">come in 💕</a>
  </main>

  <button id="skip" class="btn btn--ghost skip" type="button">skip the tax →</button>
