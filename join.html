<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>joining 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    .join { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 32px; text-align: center; }
    .join h1 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(2.6rem, 6vw, 4rem); color: var(--rose); }
    .join p { margin: 0; max-width: 32ch; color: var(--plum-soft); }
    .join .emoji { font-size: 3rem; }
  </style>
  <script type="module" src="assets/js/join.js"></script>
</head>
<body>
  <main class="join">
    <div id="emoji" class="emoji">💌</div>
    <h1 id="title">one sec…</h1>
    <p id="msg">checking your invite</p>
    <a id="go" class="btn" href="index.html" hidden>come in 💕</a>
  </main>
</body>
</html>
