<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>kiss catcher 💋</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💋</text></svg>">
  <script src="../assets/js/tax.js"></script>
  <script>KissTax.require();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/characters.css">
  <link rel="stylesheet" href="../assets/css/kiss-catcher.css">
  <script type="module" src="../assets/js/kiss-catcher.js"></script>
</head>
<body>
  <main class="kc">
    <header class="kc__top">
      <a class="back" href="../hub.html">← home</a>
      <div class="hud" aria-live="off">
        <span class="hud__item">score <b id="score">0</b></span>
        <span id="mult" class="hud__mult" hidden>x2</span>
        <span id="lives" class="hud__lives" aria-label="lives"></span>
      </div>
    </header>

    <section id="arena" class="arena" aria-label="game area">
      <div id="items"></div>
      <div id="player" class="player"></div>
      <div class="floor" aria-hidden="true"></div>
      <div id="overlay" class="overlay"></div>
    </section>

    <p class="kc__hint">← → or A / D to move · or drag · P to pause</p>
  </main>
</body>
</html>
