<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>love letters 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <script src="../assets/js/tax.js"></script>
  <script>KissTax.require();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/characters.css">
  <link rel="stylesheet" href="../assets/css/love.css">
  <script type="module" src="../assets/js/love.js"></script>
</head>
<body>
  <main class="love">
    <section class="love__side">
      <a class="back" href="../hub.html">← home</a>
      <h1 class="love__title">love letters</h1>
      <p class="love__sub">old poems and lines from books, written by other people who felt the same way.</p>

      <div id="toggle" class="toggle" role="tablist" aria-label="what to show">
        <span class="toggle__pill" aria-hidden="true"></span>
        <button type="button" role="tab" data-mode="both">both</button>
        <button type="button" role="tab" data-mode="poems">poems</button>
        <button type="button" role="tab" data-mode="quotes">from books</button>
      </div>

      <button id="next" class="btn" type="button">another one 💌</button>
      <p class="hint">or press → · double-click the letter to love it</p>
    </section>

    <section class="love__stage">
      <article id="letter" class="letter is-loading">
        <div class="letter__seal" aria-hidden="true">♥</div>
        <div id="kind" class="letter__kind">opening the envelope…</div>
        <h2 id="title" class="letter__title"></h2>
        <div id="body" class="letter__body"></div>
        <div id="by" class="letter__by"></div>
      </article>
    </section>
  </main>
</body>
</html>
