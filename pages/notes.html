<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>post-it wall 📝</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <script src="../assets/js/tax.js"></script>
  <script>KissTax.require();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/notes.css">
  <script type="module" src="../assets/js/notes.js"></script>
</head>
<body>
  <main class="wall">
    <header class="wall__top">
      <div>
        <a class="back" href="../hub.html">← home</a>
        <h1 class="wall__title">post-it wall</h1>
        <p class="wall__sub">little notes for each other. drag them anywhere.</p>
      </div>

      <form id="composer" class="composer card" autocomplete="off">
        <textarea id="body" maxlength="500" rows="2" placeholder="write a note…" required></textarea>
        <div class="composer__row">
          <div id="swatches" class="swatches" role="radiogroup" aria-label="note colour"></div>
          <button class="btn" type="submit">stick it 📌</button>
        </div>
        <p id="status" class="composer__status" role="status" hidden></p>
      </form>
    </header>

    <section id="board" class="board" aria-label="notes">
      <p id="empty" class="board__empty" hidden>the wall is empty. stick the first note 💌</p>
    </section>
  </main>
</body>
</html>
